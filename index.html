<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIENDA JJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0E10; --bg-soft:#17171A; --card:#1C1C1F;
    --text:#F2F0EB; --muted:#9A9A9F; --line:#2A2A2E;
    --gold:#C9A227; --gold-soft:#E7C55A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  h1,h2,h3{font-family:'Archivo',system-ui,sans-serif;margin:0;}
  img{max-width:100%;}
  button{font-family:inherit;cursor:pointer;}

  .topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:rgba(14,14,16,0.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-circle{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 30% 30%, var(--gold-soft), var(--gold) 70%);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#0E0E10;font-size:14px;
    background-size:cover;background-position:center;
    overflow:hidden;
  }
  .brand-name{font-weight:900;font-size:17px;letter-spacing:0.3px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .cart-btn{
    position:relative;background:none;border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:8px 10px;font-size:17px;
  }
  .cart-count{
    position:absolute;top:-6px;right:-6px;background:var(--gold);color:#0E0E10;
    font-size:11px;font-weight:700;border-radius:50%;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  .carousel{position:relative;margin:14px;border-radius:16px;overflow:hidden;background:var(--bg-soft);}
  .track{display:flex;transition:transform .4s ease;}
  .slide{
    min-width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;
  }
  .slide h2{font-size:clamp(22px,6vw,30px);}
  .slide p{color:var(--muted);margin:0;font-size:14px;max-width:32ch;}
  .slide .tag{color:var(--gold-soft);font-weight:700;font-size:13px;}
  .slide-img{
    background-size:cover;background-position:center;
    align-items:flex-start;justify-content:flex-end;padding:16px;
  }
  .slide-btn{
    margin-top:4px;background:var(--gold);color:#0E0E10;border:none;
    border-radius:8px;padding:9px 18px;font-weight:700;font-size:13px;text-decoration:none;
  }
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(0,0,0,0.35);border:none;color:var(--text);
    width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;
  }
  .arrow.left{left:10px;} .arrow.right{right:10px;}
  .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .dot.active{background:var(--gold);}
  .trust-note{
    margin:0 14px 14px;padding:10px 14px;border-radius:12px;
    background:var(--bg-soft);border:1px solid var(--line);
    color:var(--gold-soft);font-weight:700;font-size:13px;
    text-align:center;
  }

  .section{padding:22px 18px 6px;}
  .section h3{font-size:19px;margin-bottom:12px;}

  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:12px;
  }
  .section-head h3{margin-bottom:0;}
  .search-wrap{
    position:relative;flex-shrink:0;
  }
  .search-wrap input{
    width:110px;background:#FFFFFF;border:1px solid var(--line);
    color:#0E0E10;border-radius:20px;padding:8px 12px 8px 30px;
    font-size:13px;font-family:'Inter',system-ui,sans-serif;
    transition:width .25s ease;
  }
  .search-wrap input:focus{width:150px;outline:none;border-color:var(--gold);}
  .search-wrap input::placeholder{color:#8A8A8E;}
  .search-wrap .search-icon{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    font-size:13px;color:#8A8A8E;pointer-events:none;
  }
  .no-results{color:var(--muted);font-size:14px;text-align:center;padding:24px 0;}
  #productos{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px));}

  .row-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .row-scroll .p-card{min-width:150px;}

  .cat-nav{gap:8px;margin-bottom:16px;}
  .cat-chip{
    flex-shrink:0;background:var(--gold);border:1px solid var(--gold);color:#0E0E10;
    border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;
    box-shadow:0 2px 8px rgba(201,162,39,0.25);
  }
  .cat-chip:active{background:var(--gold-soft);border-color:var(--gold-soft);}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .category-block{margin-bottom:20px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px));}
  .category-title{
    font-size:13px;text-transform:none;color:var(--gold-soft);
    font-weight:700;margin:0 0 10px;
  }

  .p-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:10px;display:flex;flex-direction:column;gap:8px;
  }
  .p-thumb{
    aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:'Archivo';font-weight:900;font-size:clamp(12px,4.2vw,22px);color:#E5E5E5;
    text-align:center;padding:4px;letter-spacing:0.3px;
  }
  .p-thumb.combo-thumb{font-size:clamp(10px,3vw,14px);line-height:1.2;}
  .p-name{font-size:14px;font-weight:600;line-height:1.3;}
  .p-price-row{display:flex;align-items:baseline;gap:6px;}
  .p-price{font-weight:700;font-size:15px;}
  .p-old{color:var(--muted);text-decoration:line-through;font-size:12px;}
  .badge{
    align-self:flex-start;background:var(--gold);color:#0E0E10;font-weight:700;
    font-size:10px;padding:2px 7px;border-radius:6px;margin-bottom:-2px;
  }
  .add-btn{
    margin-top:2px;background:var(--gold);color:#0E0E10;border:none;
    border-radius:8px;padding:8px 0;font-weight:700;font-size:13px;
  }
  .add-btn:active{opacity:0.8;}

  .cart-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:29;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .cart-overlay.open{opacity:1;pointer-events:auto;}
  .cart-drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--bg-soft);
    z-index:30;transform:translateX(100%);transition:transform .3s ease;
    display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);
  }
  .cart-drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .drawer-head button{background:none;border:none;color:var(--text);font-size:18px;}
  #cart-items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .cart-empty{color:var(--muted);font-size:14px;margin-top:20px;text-align:center;}
  .cart-row{display:flex;gap:10px;align-items:center;}
  .cart-row .mini{
    width:40px;height:40px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:900;color:#E5E5E5;
    font-size:8px;text-align:center;line-height:1;padding:2px;
  }
  .cart-row .info{flex:1;font-size:13px;}
  .cart-row .qty{display:flex;align-items:center;gap:6px;}
  .qty button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--text);}
  .remove-btn{
    background:none;border:none;color:var(--muted);font-size:16px;
    padding:0 2px;line-height:1;flex-shrink:0;
  }
  .remove-btn:active{color:#E7896A;}
  .cart-total{
    display:flex;justify-content:space-between;font-weight:700;padding:10px 0;
    border-top:1px solid var(--line);margin-top:8px;
  }
  #name-input{
    background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:10px;font-size:14px;margin-top:4px;
  }
  .pay-method{font-size:13px;color:var(--muted);margin:8px 0;}
  .pay-method strong{color:var(--text);}
  .checkout-btn{
    background:var(--gold);color:#0E0E10;border:none;border-radius:10px;
    padding:13px 0;font-weight:700;font-size:14px;
  }

  .help-wrap{
    position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }
  .help-bubble{
    width:52px;height:52px;border-radius:50%;border:none;
    background:radial-gradient(circle at 30% 30%, var(--gold-soft), var(--gold) 70%);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,0.45);
  }
  .help-menu{
    display:none;flex-direction:column;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:10px;
    min-width:220px;box-shadow:0 10px 26px rgba(0,0,0,0.5);
  }
  .help-menu.open{display:flex;}
  .help-menu p{margin:0 2px 2px;font-size:12px;color:var(--muted);}
  .help-option{
    text-decoration:none;color:var(--text);background:var(--bg-soft);
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;
  }
  .help-option:active{border-color:var(--gold);}

  @media (min-width:640px){
    .grid{grid-template-columns:repeat(3,1fr);}
    .carousel{max-width:520px;margin:14px auto;}
  }
</style>
</head>

let cart = {};
let slideIndex = 0;

function money(n){ return "$" + n.toLocaleString("es-CO"); }

function renderCarousel(){
  const track = document.getElementById("track");
  const dots = document.getElementById("dots");
  track.innerHTML = slides.map(s => s.img ? `
    <div class="slide slide-img" style="background-image:url('${s.img}')">
      ${s.ctaAction ? `<button class="slide-btn" onclick="${s.ctaAction}">${s.ctaLabel}</button>` :
        s.ctaLabel ? `<a class="slide-btn" href="#${s.ctaTarget}">${s.ctaLabel}</a>` : ''}
    </div>` : `
    <div class="slide">
      <span class="tag">${s.tag}</span>
      <h2>${s.title}</h2>
      <p>${s.text}</p>
      ${s.ctaLabel ? `<a class="slide-btn" href="#${s.ctaTarget}">${s.ctaLabel}</a>` : ''}
    </div>`).join("");
  dots.innerHTML = slides.map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join("");
}
function moveSlide(dir){
  slideIndex = (slideIndex + dir + slides.length) % slides.length;
  document.getElementById("track").style.transform = `translateX(-${slideIndex*100}%)`;
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active", i===slideIndex));
}
setInterval(()=>moveSlide(1), 5000);

function productCard(p){
  const comboClass = p.tag === "COMBO" ? " combo-thumb" : "";
  return `
    <div class="p-card">
      ${p.lanzamiento ? '<span class="badge">Nuevo</span>' : ''}
      <div class="p-thumb${comboClass}" style="background:${p.color}">${p.icon || p.tag}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-price-row">
        <span class="p-price">${money(p.price)}</span>
        ${p.old ? `<span class="p-old">${money(p.old)}</span>` : ''}
      </div>
      <button class="add-btn" onclick="addToCart(${p.id})">Agregar al carrito</button>
    </div>`;
}

const slugify = s => "cat-" + s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");

const categoryPriority = ["Combos de Dos", "Combos Triples 🚀"];

function renderCategoryNav(){
  const all = [...new Set(products.map(p => p.category || "Otros"))];
  const ordered = [
    ...categoryPriority.filter(c => all.includes(c)),
    ...all.filter(c => !categoryPriority.includes(c))
  ];
  document.getElementById("catNav").innerHTML = ordered.map(cat =>
    `<button class="cat-chip" onclick="goToCategory('${cat.replace(/'/g,"\\'")}')">${cat}</button>`
  ).join("");
}

function goToCategory(cat){
  const input = document.getElementById("searchInput");
  if(input.value){ input.value = ""; renderProducts(); }
  const el = document.getElementById(slugify(cat));
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

function renderProducts(list){
  const items = list || products;

  document.getElementById("lanzamientos").innerHTML =
    products.filter(p=>p.lanzamiento).map(productCard).join("");

  if(items.length === 0){
    document.getElementById("productos").innerHTML = '<p class="no-results">No se encontraron productos.</p>';
    return;
  }

  const categories = [...new Set(items.map(p => p.category || "Otros"))];
  document.getElementById("productos").innerHTML = categories.map(cat => `
    <div class="category-block" id="${slugify(cat)}">
      <h4 class="category-title">${cat}</h4>
      <div class="grid">
        ${items.filter(p => (p.category || "Otros") === cat).map(productCard).join("")}
      </div>
    </div>`).join("");
}

function filterProducts(query){
  const q = query.trim().toLowerCase();
  if(!q){ renderProducts(); return; }
  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.category || "").toLowerCase().includes(q) ||
    (p.tag || "").toLowerCase().includes(q)
  );
  renderProducts(filtered);
  document.getElementById("productos").scrollIntoView({behavior:"smooth", block:"start"});
}

function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  updateCartUI();
  toggleCart(true);
}
function changeQty(id, delta){
  cart[id] = (cart[id]||0) + delta;
  if(cart[id] <= 0) delete cart[id];
  updateCartUI();
}
function removeFromCart(id){
  delete cart[id];
  updateCartUI();
}

function updateCartUI(){
  const ids = Object.keys(cart);
  document.getElementById("cartCount").textContent =
    ids.reduce((sum,id)=>sum+cart[id],0);

  const itemsEl = document.getElementById("cartItems");
  if(ids.length === 0){
    itemsEl.innerHTML = '<p class="cart-empty">Tu carrito está vacío</p>';
  } else {
    itemsEl.innerHTML = ids.map(id=>{
      const p = products.find(x=>x.id==id);
      return `
        <div class="cart-row">
          <div class="mini" style="background:${p.color}">${p.icon || p.tag}</div>
          <div class="info">${p.name}<br><span style="color:var(--muted)">${money(p.price)}</span></div>
          <button class="remove-btn" onclick="removeFromCart(${p.id})" aria-label="Quitar">✕</button>
        </div>`;
    }).join("");
  }

  const total = ids.reduce((sum,id)=>{
    const p = products.find(x=>x.id==id);
    return sum + p.price*cart[id];
  },0);
  document.getElementById("cartTotal").textContent = money(total);
}

function toggleCart(forceOpen){
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("overlay");
  const willOpen = forceOpen === true ? true : !drawer.classList.contains("open");
  drawer.classList.toggle("open", willOpen);
  overlay.classList.toggle("open", willOpen);
}

function showCheckoutMsg(text){
  const el = document.getElementById("checkoutMsg");
  el.textContent = text;
  el.style.display = text ? "block" : "none";
}

function buildWhatsappUrl(){
  const ids = Object.keys(cart);
  if(ids.length === 0){ showCheckoutMsg("Tu carrito está vacío."); return null; }
  const name = document.getElementById("nameInput").value.trim();
  if(!name){ showCheckoutMsg("Por favor escribe tu nombre."); return null; }

  let total = 0;
  let lines = ids.map(id=>{
    const p = products.find(x=>x.id==id);
    const sub = p.price*cart[id];
    total += sub;
    return `• ${p.name} x${cart[id]} - ${money(sub)}`;
  }).join("\n");

  const message =
`Hola, quiero hacer un pedido en TIENDA JJ:

${lines}

Total: ${money(total)}
Nombre: ${name}
Método de pago: Nequi`;

  showCheckoutMsg("");
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
}

document.getElementById("checkoutBtn").addEventListener("click", function(e){
  const url = buildWhatsappUrl();
  if(!url){ e.preventDefault(); return; }
  this.href = url;
});

renderCarousel();
renderCategoryNav();
renderProducts();
updateCartUI();
</script>
